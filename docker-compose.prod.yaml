services:
  cascii_server:
    container_name: cascii_server
    image: ${IMAGE_NAME}
    restart: always
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env


  mysql:
    container_name: cascii_mysql
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: defaultdb
      MYSQL_ROOT_PASSWORD: root # Changed
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

volumes:
  mysql_data:
